<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Zeyvola</title>
  <desc id="d">Record once — zoom, frame and hide afterwards.</desc>
  <defs>
    <radialGradient id="glowOrange" gradientUnits="userSpaceOnUse" cx="90" cy="-60" r="620">
      <stop offset="0" stop-color="#ff8f2a" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#ff8f2a" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ff8f2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" gradientUnits="userSpaceOnUse" cx="1240" cy="-20" r="660">
      <stop offset="0" stop-color="#9660ff" stop-opacity="0.40"/>
      <stop offset="0.45" stop-color="#9660ff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#9660ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLow" gradientUnits="userSpaceOnUse" cx="700" cy="520" r="560">
      <stop offset="0" stop-color="#7a4ce6" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#7a4ce6" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#7a4ce6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0.18">
      <stop offset="0" stop-color="#ffb062"/>
      <stop offset="0.4" stop-color="#ff8f6a"/>
      <stop offset="1" stop-color="#c49bff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="#121019"/>
  <rect width="1280" height="360" fill="url(#glowOrange)"/>
  <rect width="1280" height="360" fill="url(#glowViolet)"/>
  <rect width="1280" height="360" fill="url(#glowLow)"/>

  <!-- Glass panel -->
  <rect x="120" y="56" width="1040" height="248" rx="28" fill="url(#glass)" stroke="#e8deff" stroke-opacity="0.13"/>
  <rect x="160" y="56.5" width="960" height="1" fill="url(#edge)"/>

  <!-- Brand mark: the stage with the camera bubble (same drawing as the app's header, 24-unit grid) -->
  <g transform="translate(176 112) scale(4.4)">
    <rect x="2.5" y="4" width="19" height="13.5" rx="3.5" fill="none" stroke="#f7f4fb" stroke-width="1.7"/>
    <circle cx="17.3" cy="16.6" r="4.4" fill="#ff8f2a" stroke="#121019" stroke-width="1.6"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
    <text x="306" y="168" font-size="80" font-weight="700" fill="#f7f4fb" letter-spacing="-1.5">Zeyvola</text>
    <text x="309" y="216" font-size="29" font-weight="600" fill="url(#accentText)">Record once — zoom, frame and hide afterwards.</text>

    <g font-size="15" font-weight="500" fill="#d9d2e8" text-anchor="middle">
      <rect x="309" y="240" width="162" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#e8deff" stroke-opacity="0.14"/>
      <text x="390" y="262">macOS &amp; Windows</text>
      <rect x="483" y="240" width="208" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#e8deff" stroke-opacity="0.14"/>
      <text x="587" y="262">Auto zoom from clicks</text>
      <rect x="703" y="240" width="146" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#e8deff" stroke-opacity="0.14"/>
      <text x="776" y="262">Privacy masks</text>
      <rect x="861" y="240" width="126" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#e8deff" stroke-opacity="0.14"/>
      <text x="924" y="262">MP4 · WebM</text>
    </g>
  </g>
</svg>
