name: CI

# Changes that only concern the Windows test (windows.yml) do not start this macOS job.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/windows.yml'
      - 'tests/windows-env/**'
      - 'tests/windows-terms/**'
      - 'tests/media-check/mf-check.ps1'
      - 'tests/real-capture-web/windows-clicks.ps1'
  pull_request:
    paths-ignore:
      - '.github/workflows/windows.yml'
      - 'tests/windows-env/**'
      - 'tests/windows-terms/**'
      - 'tests/media-check/mf-check.ps1'
      - 'tests/real-capture-web/windows-clicks.ps1'

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    env:
      # Electron's download cache (electron/install.js, tools/electron-artifacts.mjs), outside the checkout.
      electron_config_cache: ${{ github.workspace }}/.cache/ci-electron  # no '..': actions/cache refuses it; .cache/ is git-ignored
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Node sürümü .nvmrc'den. / Node version from .nvmrc.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # pnpm sürümü package.json "packageManager" alanından (Node ile gelen Corepack).
      # pnpm version from the "packageManager" field in package.json (Corepack ships with Node).
      - run: corepack enable

      # Electron 44 has no install script: it downloads its binary on first use, and the tests that
      # read Electron's licence files (licenses.test.ts) then race that download. It is installed
      # here, from a cache kept between runs (same folder package.mjs uses for its zips).
      - name: Electron önbelleği / Electron cache
        id: electron-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.electron_config_cache }}
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
      - name: Electron ikilisi / Electron binary
        run: pnpm --filter @zeyvola/desktop exec node node_modules/electron/install.js

      - name: Electron önbelleğini kaydet / save Electron cache
        if: steps.electron-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.electron_config_cache }}
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm typecheck
      - run: pnpm test
      # pnpm smoke burada çalışmaz: ekran ve GPU ister. / pnpm smoke is not run here: it needs a display and a GPU.
